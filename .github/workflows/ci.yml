name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Build
        run: dotnet publish src/DayOneMcp -c Release -r linux-x64 -o out

      - name: Install the Day One CLI
        run: npm install -g @dayone/cli@latest

      - name: Smoke test (MCP over stdio against the real Day One CLI)
        env:
          DO_NOT_TRACK: '1'
        run: |
          # Keyword-only build: same search behaviour as Windows, and no model download.
          DAYONE="$(npm root -g)/@dayone/cli/node_modules/@dayone/cli-linux-x64-no-embeddings/dayone"
          python3 tests/smoke_test.py out/DayOneMcp "$DAYONE"

      - name: Check installer scripts
        run: |
          bash -n install.sh
          pwsh -NoProfile -Command 'foreach ($f in "install.ps1","configure.ps1") { $e=$null; [System.Management.Automation.Language.Parser]::ParseFile($f,[ref]$null,[ref]$e) | Out-Null; if ($e) { $e; exit 1 } else { "$f parses OK" } }'
          # The PowerShell scripts must stay ASCII-only (Windows PowerShell 5.1 misreads UTF-8 without a BOM).
          if grep -nP '[^\x00-\x7F]' install.ps1 configure.ps1; then echo "Non-ASCII characters found"; exit 1; fi

      - name: Validate Claude Desktop extension manifest
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate packaging/mcpb/manifest.json

      - name: Validate Claude Code plugin and marketplace
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate --strict .
          claude plugin validate --strict ./plugin

      - name: Smoke test through the Claude Code plugin launcher
        env:
          DO_NOT_TRACK: '1'
          DAYONE_MCP_EXE: ${{ github.workspace }}/out/DayOneMcp   # skip the download; test the passthrough
        run: |
          DAYONE="$(npm root -g)/@dayone/cli/node_modules/@dayone/cli-linux-x64-no-embeddings/dayone"
          printf '#!/bin/sh\nexec node "%s/plugin/launcher/dayone-mcp.mjs" "$@"\n' "$GITHUB_WORKSPACE" > via-launcher.sh
          chmod +x via-launcher.sh
          python3 tests/smoke_test.py ./via-launcher.sh "$DAYONE"
