<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>dayone-mcp: search your journal</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B88D8"/>
      <stop offset="0.55" stop-color="#7A3FE5"/>
      <stop offset="1" stop-color="#142E86"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0A0D16" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Open journal -->
  <g filter="url(#shadow)">
    <path d="M256 150 C 214 124, 150 116, 96 128 L 96 366 C 150 354, 214 362, 256 388 Z" fill="#FFFFFF"/>
    <path d="M256 150 C 298 124, 362 116, 416 128 L 416 366 C 362 354, 298 362, 256 388 Z" fill="#EEF3FC"/>
  </g>
  <!-- Spine -->
  <path d="M256 150 L 256 388" stroke="#C9D4F0" stroke-width="4"/>

  <!-- Writing lines (left page) -->
  <g stroke="#A9B9EC" stroke-width="10" stroke-linecap="round">
    <path d="M128 178 C 162 172, 198 176, 226 186"/>
    <path d="M128 214 C 162 208, 198 212, 226 222"/>
    <path d="M128 250 C 162 244, 198 248, 226 258"/>
    <path d="M128 286 C 150 282, 170 283, 190 287"/>
  </g>
  <!-- Writing lines (right page, partly under the lens) -->
  <g stroke="#A9B9EC" stroke-width="10" stroke-linecap="round">
    <path d="M286 186 C 314 176, 350 172, 384 178"/>
    <path d="M286 222 C 300 217, 316 214, 330 213"/>
  </g>

  <!-- Magnifying glass -->
  <g filter="url(#shadow)">
    <!-- white outline keeps the dark glass visible on the indigo corner -->
    <line x1="392" y1="380" x2="448" y2="436" stroke="#FFFFFF" stroke-width="42" stroke-linecap="round"/>
    <circle cx="340" cy="328" r="74" fill="none" stroke="#FFFFFF" stroke-width="34"/>
    <line x1="392" y1="380" x2="448" y2="436" stroke="#0A0D16" stroke-width="30" stroke-linecap="round"/>
    <circle cx="340" cy="328" r="74" fill="url(#lens)" stroke="#0A0D16" stroke-width="22"/>
  </g>
  <!-- Highlighted line seen through the lens -->
  <path d="M296 330 C 320 322, 352 320, 380 326" stroke="#7A3FE5" stroke-width="12" stroke-linecap="round"/>
  <!-- Lens glint -->
  <path d="M296 300 A 50 50 0 0 1 330 272" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
</svg>
